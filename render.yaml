services:
  - type: web
    name: enterprise-ai-knowledge-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: ACCOUNT_AUTH_MODE
        value: "true"
      - key: PUBLIC_DEMO_MODE
        value: "false"
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-knowledge-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: enterprise-ai-knowledge-db
          property: connectionString
      - key: LOCAL_STORAGE_PATH
        value: /tmp/enterprise-ai-uploads
      # Keep `local` only for the public demo. Set this to `s3` and add the private
      # OBJECT_STORAGE_* secrets in Render before accepting real enterprise files.
      - key: OBJECT_STORAGE_BACKEND
        value: local

databases:
  - name: enterprise-ai-knowledge-db
    plan: free
    databaseName: enterprise_ai
    user: enterprise_ai
    ipAllowList: []
