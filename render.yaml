services:
  - type: web
    name: enterprise-ai-knowledge-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: ACCOUNT_AUTH_MODE
        value: "true"
      - key: APP_PUBLIC_URL
        value: https://enterprise-ai-knowledge-assistant-y39d.onrender.com
      # Enable only after SMTP_* secrets have been configured in Render.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: EMAIL_DELIVERY_BACKEND
        value: disabled
      - key: PUBLIC_DEMO_MODE
        value: "false"
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-knowledge-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: enterprise-ai-knowledge-db
          property: connectionString
      - key: LOCAL_STORAGE_PATH
        value: /tmp/enterprise-ai-uploads
      # Keep `local` only for the public demo. Set this to `s3` and add the private
      # OBJECT_STORAGE_* secrets in Render before accepting real enterprise files.
      - key: OBJECT_STORAGE_BACKEND
        value: local
      # The public demo stays in private/local evidence mode. Configure provider
      # models and OPENAI_API_KEY as Render Secrets only after a data review.
      - key: AI_PROVIDER
        value: local
      - key: EMBEDDING_PROVIDER
        value: disabled
      - key: AI_ALLOW_RESTRICTED
        value: "false"

databases:
  - name: enterprise-ai-knowledge-db
    plan: free
    databaseName: enterprise_ai
    user: enterprise_ai
    ipAllowList: []
